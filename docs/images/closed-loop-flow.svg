<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title desc">
<title id="title">Closed-loop workflow: evidence, approval, action, verification</title>
<desc id="desc">Reference workflow composed by an operator for supported detection and remediation pairs. Raw signals are normalized to OCSF and reviewed as findings. Plan in dry-run, obtain the skill-specific approval, apply via an authorized CLI or provider workflow, and retain audit evidence. Schedule a separate verification. VERIFIED confirms the expected state at check time; DRIFT reports mismatch; UNREACHABLE leaves state unknown. Dashed links require operator orchestration. A successful action is not proof of closure.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bac9dc"/></marker></defs>
<rect width="960" height="800" rx="16" fill="#0b1220"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<text x="32" y="47" font-size="28" font-weight="700" fill="#edf4fc">From evidence to a verified outcome</text>
<text x="32" y="77" font-size="16" font-weight="400" fill="#bac9dc">Reference workflow for supported pairs; operators connect and schedule the steps.</text>
<text x="32" y="119" font-size="13" font-weight="700" fill="#8bc9ff">01  READ AND REVIEW</text>
<rect x="32" y="140" width="200" height="100" rx="12" fill="#121e30" stroke="#8bc9ff"/>
<text x="46" y="168" font-size="18" font-weight="700" fill="#8bc9ff">Raw signals</text>
<text x="46" y="194" font-size="15" font-weight="400" fill="#bac9dc">Cloud · identity</text>
<text x="46" y="216" font-size="15" font-weight="400" fill="#bac9dc">Kubernetes · MCP</text>
<rect x="264" y="140" width="200" height="100" rx="12" fill="#121e30" stroke="#8bc9ff"/>
<text x="278" y="168" font-size="18" font-weight="700" fill="#8bc9ff">Ingest</text>
<text x="278" y="194" font-size="15" font-weight="400" fill="#bac9dc">Normalize evidence</text>
<text x="278" y="216" font-size="15" font-weight="400" fill="#bac9dc">to OCSF JSONL</text>
<rect x="496" y="140" width="200" height="100" rx="12" fill="#121e30" stroke="#8bc9ff"/>
<text x="510" y="168" font-size="18" font-weight="700" fill="#8bc9ff">Detect</text>
<text x="510" y="194" font-size="15" font-weight="400" fill="#bac9dc">OCSF 2004 findings</text>
<text x="510" y="216" font-size="15" font-weight="400" fill="#bac9dc">with evidence context</text>
<rect x="728" y="140" width="200" height="100" rx="12" fill="#121e30" stroke="#8bc9ff"/>
<text x="742" y="168" font-size="18" font-weight="700" fill="#8bc9ff">Review</text>
<text x="742" y="194" font-size="15" font-weight="400" fill="#bac9dc">Inspect findings</text>
<text x="742" y="216" font-size="15" font-weight="400" fill="#bac9dc">SARIF / Mermaid</text>
<path d="M232 190H256" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M464 190H488" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M696 190H720" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M828 240V263H132V286" fill="none" stroke="#bac9dc" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="32" y="313" font-size="13" font-weight="700" fill="#ffd177">02  PLAN AND AUTHORIZE</text>
<rect x="32" y="332" width="200" height="100" rx="12" fill="#121e30" stroke="#ffd177"/>
<text x="46" y="360" font-size="18" font-weight="700" fill="#ffd177">Dry-run plan</text>
<text x="46" y="386" font-size="15" font-weight="400" fill="#bac9dc">Inspect exact targets</text>
<text x="46" y="408" font-size="15" font-weight="400" fill="#bac9dc">and intended changes</text>
<rect x="264" y="332" width="200" height="100" rx="12" fill="#121e30" stroke="#ffd177"/>
<text x="278" y="360" font-size="18" font-weight="700" fill="#ffd177">Human approval</text>
<text x="278" y="386" font-size="15" font-weight="400" fill="#bac9dc">Skill-specific policy</text>
<text x="278" y="408" font-size="15" font-weight="400" fill="#bac9dc">scope and window</text>
<rect x="496" y="332" width="200" height="100" rx="12" fill="#121e30" stroke="#ffd177"/>
<text x="510" y="360" font-size="18" font-weight="700" fill="#ffd177">Apply</text>
<text x="510" y="386" font-size="15" font-weight="400" fill="#bac9dc">Authorized CLI or</text>
<text x="510" y="408" font-size="15" font-weight="400" fill="#bac9dc">provider workflow</text>
<rect x="728" y="332" width="200" height="100" rx="12" fill="#121e30" stroke="#ffd177"/>
<text x="742" y="360" font-size="18" font-weight="700" fill="#ffd177">Audit evidence</text>
<text x="742" y="386" font-size="15" font-weight="400" fill="#bac9dc">Stores and ordering</text>
<text x="742" y="408" font-size="15" font-weight="400" fill="#bac9dc">defined by the skill</text>
<path d="M232 382H256" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M464 382H488" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M696 382H720" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M828 432V455H132V478" fill="none" stroke="#bac9dc" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="32" y="505" font-size="13" font-weight="700" fill="#73e2c4">03  CHECK THE RESULT</text>
<rect x="32" y="524" width="200" height="110" rx="12" fill="#121e30" stroke="#73e2c4"/>
<text x="46" y="554" font-size="18" font-weight="700" fill="#73e2c4">Schedule</text>
<text x="46" y="581" font-size="15" font-weight="400" fill="#bac9dc">Operator-owned timer</text>
<text x="46" y="604" font-size="15" font-weight="400" fill="#bac9dc">or workflow trigger</text>
<path d="M232 579H256" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="264" y="524" width="200" height="110" rx="12" fill="#121e30" stroke="#73e2c4"/>
<text x="278" y="554" font-size="18" font-weight="700" fill="#73e2c4">Re-verify</text>
<text x="278" y="581" font-size="15" font-weight="400" fill="#bac9dc">Read current state</text>
<text x="278" y="604" font-size="15" font-weight="400" fill="#bac9dc">against expected state</text>
<path d="M464 579H488" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="496" y="524" width="432" height="110" rx="12" fill="#121e30" stroke="#73e2c4"/>
<text x="512" y="551" font-size="15" font-weight="700" fill="#73e2c4">VERIFIED</text>
<text x="655" y="551" font-size="15" font-weight="400" fill="#bac9dc">Expected state at check time</text>
<text x="512" y="581" font-size="15" font-weight="700" fill="#ffd177">DRIFT</text>
<text x="655" y="581" font-size="15" font-weight="400" fill="#bac9dc">Mismatch → finding for review</text>
<text x="512" y="611" font-size="15" font-weight="700" fill="#cab9ff">UNREACHABLE</text>
<text x="655" y="611" font-size="15" font-weight="400" fill="#bac9dc">State unknown; needs attention</text>
<rect x="32" y="658" width="896" height="110" rx="12" fill="#121e30" stroke="#35465e"/>
<text x="48" y="686" font-size="19" font-weight="700" fill="#edf4fc">Action completed ≠ closure verified</text>
<text x="48" y="714" font-size="16" font-weight="400" fill="#bac9dc">Dashed links require orchestration. A diagram does not install a scheduler or audit sink.</text>
<text x="48" y="742" font-size="15" font-weight="400" fill="#bac9dc">MCP and SkillsClient keep write-capable calls in safe mode; approval does not enable --apply.</text>
</g>
</svg>
