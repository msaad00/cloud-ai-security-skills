<svg xmlns="http://www.w3.org/2000/svg" width="960" height="224" viewBox="0 0 960 224" role="img" aria-labelledby="title desc">
  <title id="title">A role session creates an IAM user's access key</title>
  <desc id="desc">Synthetic CloudTrail example. Role session AROAEXAMPLEID:alice successfully calls CreateAccessKey for IAM user bob. This is a rule match, not confirmation of an incident. Approved rotation also matches; authorization and later key use remain unknown.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#64748b" stroke-width="1.2"/></marker>
  </defs>
  <rect x=".5" y=".5" width="959" height="223" rx="12" fill="#0d1420" stroke="#293548"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
    <g fill="#121e2e" stroke="#304158">
      <rect x="28" y="28" width="244" height="112" rx="8"/>
      <rect x="358" y="28" width="244" height="112" rx="8"/>
      <rect x="688" y="28" width="244" height="112" rx="8"/>
    </g>
    <g fill="#9aaec4" font-size="15" font-weight="500">
      <text x="52" y="57">ROLE SESSION</text>
      <text x="382" y="57">SUCCESSFUL API CALL</text>
      <text x="712" y="57">IAM USER</text>
    </g>
    <g fill="#edf3fa" font-size="30" font-weight="500">
      <text x="52" y="103">alice</text>
      <text x="712" y="103">bob</text>
    </g>
    <text x="382" y="101" fill="#83c9ee" font-size="23" font-weight="500">CreateAccessKey</text>
    <g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M286 84H343"/>
      <path d="M616 84H673"/>
    </g>
    <line x1="28" y1="166" x2="932" y2="166" stroke="#293548"/>
    <circle cx="36" cy="193" r="4" fill="#83c9ee"/>
    <text x="49" y="198" fill="#9aaec4" font-size="14">Synthetic example</text>
    <text x="932" y="198" text-anchor="end" fill="#c0cddd" font-size="15">A rule match. Investigate authorization and later key use.</text>
  </g>
</svg>
