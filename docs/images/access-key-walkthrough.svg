<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc">
  <title id="title">Investigate an AWS access-key finding</title>
  <desc id="desc">Annotated synthetic fixture, not an application screen. Four CloudTrail events produce one finding. Role session AROAEXAMPLEID:alice successfully calls CreateAccessKey for IAM user bob in account 123456789012. Authorization and subsequent key use remain unknown.</desc>
  <rect width="640" height="660" rx="16" fill="#0b1220"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="28" y="40" font-size="18" font-weight="700" fill="#67e8f9">WORKED EXAMPLE · SYNTHETIC FIXTURE</text>
    <text x="28" y="85" font-size="30" font-weight="700" fill="#f8fafc">AWS IAM access key created</text>
    <text x="28" y="120" font-size="22" fill="#cbd5e1">4 events → 1 finding → local SARIF report</text>
    <line x1="28" y1="145" x2="612" y2="145" stroke="#334155"/>
    <text x="28" y="180" font-size="18" font-weight="700" fill="#94a3b8">ACTOR · ROLE SESSION</text>
    <text x="28" y="215" font-size="27" fill="#f8fafc">AROAEXAMPLEID:alice</text>
    <text x="28" y="257" font-size="18" font-weight="700" fill="#94a3b8">TARGET · IAM USER</text>
    <text x="28" y="290" font-size="27" fill="#f8fafc">bob</text>
    <text x="28" y="332" font-size="18" font-weight="700" fill="#94a3b8">ACCOUNT</text>
    <text x="28" y="365" font-size="25" fill="#e2e8f0">123456789012</text>
    <text x="350" y="332" font-size="18" font-weight="700" fill="#94a3b8">SOURCE IP</text>
    <text x="350" y="365" font-size="25" fill="#e2e8f0">203.0.113.42</text>
    <rect x="28" y="392" width="584" height="100" rx="10" fill="#122438" stroke="#27516a"/>
    <text x="48" y="425" font-size="18" font-weight="700" fill="#67e8f9">WHY IT MATCHED</text>
    <text x="48" y="462" font-size="23" fill="#f1f5f9">Successful CreateAccessKey for user bob.</text>
    <rect x="28" y="510" width="584" height="122" rx="10" fill="#292319" stroke="#6b5430"/>
    <text x="48" y="543" font-size="18" font-weight="700" fill="#fcd34d">INVESTIGATE BEFORE CALLING IT AN INCIDENT</text>
    <text x="48" y="579" font-size="23" fill="#f1f5f9">Approved rotation also matches this rule.</text>
    <text x="48" y="612" font-size="23" fill="#f1f5f9">Authorization and later key use are unknown.</text>
  </g>
</svg>
