<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="layers-title layers-desc">
  <title id="layers-title">Cloud AI Security Skills — architecture layers</title>
  <desc id="layers-desc">Seven skill layers grouped by pipeline phase. L1 Ingest with 22 ingesters plus 4 source adapters. L2 Discover with 5 inventory skills. L3 Detect with 71 deterministic findings. L4 Evaluate with 12 benchmark families. L5 Remediate with 12 HITL write paths. L6 View with 2 OCSF-to-render converters. L7 Output with 3 append-only sinks. 131 skills across 7 layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#060b17"/><stop offset="100%" stop-color="#0a1325"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
    <symbol id="ic-signal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h11"/></symbol>
    <symbol id="ic-ingest" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 18v2a1 1 0 001 1h14a1 1 0 001-1v-2"/></symbol>
    <symbol id="ic-discover" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20.5 20.5l-4.2-4.2"/></symbol>
    <symbol id="ic-detect" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="ic-evaluate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h7"/><path d="M3.5 5.5l1.4 1.4 2.1-2.4M3.5 11.5l1.4 1.4 2.1-2.4"/></symbol>
    <symbol id="ic-remediate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3.2v5.1c0 4.7-3.2 8-8 9.7-4.8-1.7-8-5-8-9.7V6.2z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="ic-view" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h4"/></symbol>
    <symbol id="ic-output" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  </defs>
  <rect width="1200" height="490" fill="url(#bg)"/>
  <g font-family="Inter, Segoe UI, ui-sans-serif, Arial, sans-serif">
    <text x="60" y="60" font-size="30" font-weight="800" fill="#f8fafc">Seven skill layers, one flow</text>
    <text x="60" y="90" font-size="15" fill="#94a3b8">Signals → intake → analyze → act → persist. One skill bundle on CLI · CI · MCP · webhook · library · runners.</text>
    <g transform="translate(60,120)">
      <path d="M182 162H221" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M407 162H446" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M632 162H671" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M857 162H896" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="0" y="0" width="180" height="30" rx="15" fill="#0f172a" stroke="#475569"/><text x="90" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#cbd5e1" letter-spacing="1.4">SIGNALS</text>
      <rect x="0" y="44" width="180" height="236" rx="18" fill="#0d1526" stroke="#334155" stroke-dasharray="5 5"/>
      <use href="#ic-signal" x="77" y="62" width="26" height="26" color="#94a3b8"/>
      <text x="90" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#94a3b8">Sources</text>
      <g font-size="12.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">
        <rect x="18" y="128" width="68" height="30" rx="9" fill="#0f172a" stroke="#334155"/><text x="52" y="148">logs</text>
        <rect x="94" y="128" width="68" height="30" rx="9" fill="#0f172a" stroke="#334155"/><text x="128" y="148">APIs</text>
        <rect x="18" y="164" width="68" height="30" rx="9" fill="#0f172a" stroke="#334155"/><text x="52" y="184">IdP</text>
        <rect x="94" y="164" width="68" height="30" rx="9" fill="#0f172a" stroke="#334155"/><text x="128" y="184">SaaS</text>
      </g>
      <text x="90" y="228" text-anchor="middle" font-size="12" fill="#64748b">raw exports</text>
      <text x="90" y="246" text-anchor="middle" font-size="12" fill="#64748b">&amp; lake replay</text>
      <rect x="225" y="0" width="180" height="30" rx="15" fill="#0f172a" stroke="#60a5fa"/><text x="315" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.4">INTAKE</text>
      <rect x="225" y="44" width="180" height="110" rx="16" fill="#0f172a" stroke="#60a5fa"/>
      <use href="#ic-ingest" x="303" y="60" width="24" height="24" color="#93c5fd"/>
      <text x="315" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#93c5fd">Ingest</text>
      <text x="315" y="142" text-anchor="middle" font-size="30" font-weight="900" fill="#f8fafc">22<tspan font-size="18" fill="#64748b">+4</tspan></text>
      <rect x="225" y="170" width="180" height="110" rx="16" fill="#0f172a" stroke="#60a5fa"/>
      <use href="#ic-discover" x="303" y="186" width="24" height="24" color="#93c5fd"/>
      <text x="315" y="232" text-anchor="middle" font-size="14" font-weight="800" fill="#93c5fd">Discover</text>
      <text x="315" y="268" text-anchor="middle" font-size="30" font-weight="900" fill="#f8fafc">5</text>
      <rect x="450" y="0" width="180" height="30" rx="15" fill="#0f172a" stroke="#34d399"/><text x="540" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="1.4">ANALYZE</text>
      <rect x="450" y="44" width="180" height="110" rx="16" fill="#0f172a" stroke="#34d399"/>
      <use href="#ic-detect" x="528" y="60" width="24" height="24" color="#6ee7b7"/>
      <text x="540" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#6ee7b7">Detect</text>
      <text x="540" y="142" text-anchor="middle" font-size="30" font-weight="900" fill="#f8fafc">71</text>
      <rect x="450" y="170" width="180" height="110" rx="16" fill="#0f172a" stroke="#34d399"/>
      <use href="#ic-evaluate" x="528" y="186" width="24" height="24" color="#6ee7b7"/>
      <text x="540" y="232" text-anchor="middle" font-size="14" font-weight="800" fill="#6ee7b7">Evaluate</text>
      <text x="540" y="268" text-anchor="middle" font-size="30" font-weight="900" fill="#f8fafc">12</text>
      <rect x="675" y="0" width="180" height="30" rx="15" fill="#0f172a" stroke="#fbbf24"/><text x="765" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#fcd34d" letter-spacing="1.4">ACT</text>
      <rect x="675" y="44" width="180" height="110" rx="16" fill="#0f172a" stroke="#fbbf24"/>
      <use href="#ic-remediate" x="753" y="60" width="24" height="24" color="#fcd34d"/>
      <text x="765" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#fcd34d">Remediate</text>
      <text x="765" y="142" text-anchor="middle" font-size="30" font-weight="900" fill="#f8fafc">12</text>
      <rect x="675" y="170" width="180" height="110" rx="16" fill="#0f172a" stroke="#fbbf24"/>
      <use href="#ic-view" x="753" y="186" width="24" height="24" color="#fcd34d"/>
      <text x="765" y="232" text-anchor="middle" font-size="14" font-weight="800" fill="#fcd34d">View</text>
      <text x="765" y="268" text-anchor="middle" font-size="30" font-weight="900" fill="#f8fafc">2</text>
      <rect x="900" y="0" width="180" height="30" rx="15" fill="#0f172a" stroke="#2dd4bf"/><text x="990" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#5eead4" letter-spacing="1.4">PERSIST</text>
      <rect x="900" y="44" width="180" height="236" rx="18" fill="#0f172a" stroke="#2dd4bf"/>
      <use href="#ic-output" x="977" y="62" width="26" height="26" color="#5eead4"/>
      <text x="990" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#5eead4">Output</text>
      <text x="990" y="156" text-anchor="middle" font-size="34" font-weight="900" fill="#f8fafc">3</text>
      <text x="990" y="194" text-anchor="middle" font-size="12.5" fill="#94a3b8">S3 · Snowflake</text>
      <text x="990" y="214" text-anchor="middle" font-size="12.5" fill="#94a3b8">ClickHouse</text>
      <text x="990" y="246" text-anchor="middle" font-size="12" fill="#64748b">append-only sinks</text>
    </g>
    <rect x="60" y="416" width="1020" height="44" rx="12" fill="#0b1220" stroke="#334155"/>
    <text x="80" y="444" font-size="13.5" fill="#cbd5e1"><tspan font-weight="800" fill="#f8fafc">7 layers · 131 skills</tspan><tspan fill="#475569">    |    </tspan>Wire: <tspan font-weight="700" fill="#5eead4">OCSF 1.8</tspan> ingest+detect · <tspan font-weight="700" fill="#fbbf24">native</tspan> discover+remediate · <tspan font-weight="700" fill="#a78bfa">SARIF/Mermaid</tspan> view · pass-through sinks</text>
  </g>
