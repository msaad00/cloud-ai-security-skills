<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc">
<title id="title">Runtime architecture: shared skills, distinct controls</title>
<desc id="desc">CLI and CI call skill entrypoints directly; event runners add provider-specific routing. MCP, webhook, and SkillsClient use distinct execution paths. MCP and the library reject write-capable apply calls. Webhooks route only to allowlisted atomic ingesters. Audit chaining and output caps are MCP-specific controls, not universal protections. Operators configure persistence and verification.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bac9dc"/></marker></defs>
<rect width="960" height="730" rx="16" fill="#0b1220"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<text x="32" y="47" font-size="27" font-weight="700" fill="#edf4fc">One skill contract. Distinct runtime boundaries.</text>
<text x="32" y="77" font-size="16" font-weight="400" fill="#bac9dc">Choose the execution path for its actual controls and supported inputs.</text>
<text x="32" y="120" font-size="13" font-weight="700" fill="#bac9dc">ENTRY SURFACE</text>
<text x="252" y="120" font-size="13" font-weight="700" fill="#bac9dc">CONTROLS ON THIS PATH</text>
<text x="734" y="120" font-size="13" font-weight="700" fill="#bac9dc">EXECUTION</text>
<rect x="32" y="140" width="188" height="94" rx="12" fill="#121e30" stroke="#8bc9ff"/>
<text x="46" y="170" font-size="18" font-weight="700" fill="#8bc9ff">CLI · CI · queues</text>
<text x="46" y="197" font-size="13" font-weight="400" fill="#bac9dc">Direct / reference runners</text>
<path d="M220 187H244" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="252" y="140" width="442" height="94" rx="12" fill="#121e30" stroke="#35465e"/>
<text x="268" y="165" font-size="16" font-weight="400" fill="#bac9dc">Skill guards stay in the entrypoint.</text>
<text x="268" y="190" font-size="16" font-weight="400" fill="#bac9dc">Caller or runner owns credentials,</text>
<text x="268" y="215" font-size="16" font-weight="400" fill="#bac9dc">timeouts, retries, and persistence.</text>
<path d="M694 187H726" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="734" y="140" width="194" height="94" rx="12" fill="#121e30" stroke="#8bc9ff"/>
<text x="748" y="163" font-size="17" font-weight="700" fill="#8bc9ff">Selected skill</text>
<text x="748" y="184" font-size="14" font-weight="400" fill="#bac9dc">Provider reads or</text>
<text x="748" y="203" font-size="14" font-weight="400" fill="#bac9dc">approved writes</text>
<text x="748" y="222" font-size="14" font-weight="400" fill="#bac9dc">per skill contract</text>
<rect x="32" y="250" width="188" height="94" rx="12" fill="#121e30" stroke="#ffd177"/>
<text x="46" y="280" font-size="18" font-weight="700" fill="#ffd177">MCP clients</text>
<text x="46" y="307" font-size="13" font-weight="400" fill="#bac9dc">stdio / opt-in SSE</text>
<path d="M220 297H244" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="252" y="250" width="442" height="94" rx="12" fill="#121e30" stroke="#35465e"/>
<text x="268" y="275" font-size="16" font-weight="400" fill="#bac9dc">Argument policy · safe-write gate</text>
<text x="268" y="300" font-size="16" font-weight="400" fill="#bac9dc">Timeout · output cap · resource limits</text>
<text x="268" y="325" font-size="16" font-weight="400" fill="#bac9dc">Audit chain when configured</text>
<path d="M694 297H726" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="734" y="250" width="194" height="94" rx="12" fill="#121e30" stroke="#ffd177"/>
<text x="748" y="273" font-size="17" font-weight="700" fill="#ffd177">Registry tools</text>
<text x="748" y="294" font-size="14" font-weight="400" fill="#bac9dc">Write-capable</text>
<text x="748" y="313" font-size="14" font-weight="400" fill="#bac9dc">--apply rejected</text>
<text x="748" y="332" font-size="14" font-weight="400" fill="#bac9dc">at this boundary</text>
<rect x="32" y="360" width="188" height="94" rx="12" fill="#121e30" stroke="#73e2c4"/>
<text x="46" y="390" font-size="18" font-weight="700" fill="#73e2c4">Webhook</text>
<text x="46" y="417" font-size="13" font-weight="400" fill="#bac9dc">Authenticated requests</text>
<path d="M220 407H244" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="252" y="360" width="442" height="94" rx="12" fill="#121e30" stroke="#35465e"/>
<text x="268" y="385" font-size="16" font-weight="400" fill="#bac9dc">Auth · allowlist · request-size limit</text>
<text x="268" y="410" font-size="16" font-weight="400" fill="#bac9dc">Separate subprocess path and timeout</text>
<text x="268" y="435" font-size="16" font-weight="400" fill="#bac9dc">Request audit · configured sink fan-out</text>
<path d="M694 407H726" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="734" y="360" width="194" height="94" rx="12" fill="#121e30" stroke="#73e2c4"/>
<text x="748" y="383" font-size="17" font-weight="700" fill="#73e2c4">Atomic ingest</text>
<text x="748" y="404" font-size="14" font-weight="400" fill="#bac9dc">Allowlisted ingest</text>
<text x="748" y="423" font-size="14" font-weight="400" fill="#bac9dc">entrypoints only</text>
<text x="748" y="442" font-size="14" font-weight="400" fill="#bac9dc">then optional sinks</text>
<rect x="32" y="470" width="188" height="94" rx="12" fill="#121e30" stroke="#cab9ff"/>
<text x="46" y="500" font-size="18" font-weight="700" fill="#cab9ff">Python library</text>
<text x="46" y="527" font-size="13" font-weight="400" fill="#bac9dc">SkillsClient</text>
<path d="M220 517H244" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="252" y="470" width="442" height="94" rx="12" fill="#121e30" stroke="#35465e"/>
<text x="268" y="495" font-size="16" font-weight="400" fill="#bac9dc">Registry command · safe-write gate</text>
<text x="268" y="520" font-size="16" font-weight="400" fill="#bac9dc">Timeout · limits · optional sandbox</text>
<text x="268" y="545" font-size="16" font-weight="400" fill="#bac9dc">Audit callback or stderr</text>
<path d="M694 517H726" fill="none" stroke="#bac9dc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="734" y="470" width="194" height="94" rx="12" fill="#121e30" stroke="#cab9ff"/>
<text x="748" y="493" font-size="17" font-weight="700" fill="#cab9ff">Registry tools</text>
<text x="748" y="514" font-size="14" font-weight="400" fill="#bac9dc">Write-capable</text>
<text x="748" y="533" font-size="14" font-weight="400" fill="#bac9dc">--apply rejected</text>
<text x="748" y="552" font-size="14" font-weight="400" fill="#bac9dc">at this boundary</text>
<rect x="32" y="588" width="896" height="110" rx="12" fill="#121e30" stroke="#35465e"/>
<text x="48" y="615" font-size="18" font-weight="700" fill="#edf4fc">Shared entrypoints, formats chosen by layer</text>
<text x="48" y="642" font-size="16" font-weight="400" fill="#bac9dc">Ingest / detect → OCSF   ·   view → SARIF / Mermaid   ·   other layers → native / bridge</text>
<text x="48" y="671" font-size="16" font-weight="400" fill="#73e2c4">Operators connect sinks, lake replay, scheduling, and evidence retention.</text>
</g>
</svg>
